
name: Build TharGyiAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TharGyiAI-Android-Project.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -o TharGyiAI-Android-Project.zip

      - name: Build APK
        run: gradle -p TharGyiAI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TharGyiAI-APK
          path: TharGyiAI/app/build/outputs/apk/debug/app-debug.apk
